<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StackLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="app-header">
    <div class="logo-area">
      <img class="logo-icon" src="../icons/icon48.png" alt="StackLens Logo" />
      <div class="logo-text">
        <span class="logo-title">StackLens</span>
        <span class="logo-subtitle" id="domain-label">Scanning...</span>
      </div>
    </div>
    <div class="header-actions">
      <button id="theme-toggle-btn" class="theme-toggle-btn" title="Toggle theme (Light / Dark / Auto)" aria-label="Toggle theme">
        <svg class="theme-icon-sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="5"></circle>
          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="theme-icon-moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <span class="count-pill" id="tech-count">0</span>
    </div>
  </header>

  <main class="content-container">
    <div class="search-bar-wrap">
      <div class="search-input-box">
        <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="filter-input" placeholder="Search technologies, versions, or signals..." autocomplete="off" />
        <button id="clear-search-btn" class="clear-search-btn hidden" title="Clear filter">✕</button>
      </div>
    </div>

    <!-- Category groups container -->
    <div id="tech-list" class="tech-list">
      <!-- Injected dynamically -->
    </div>

    <!-- Empty / Loading state -->
    <div id="state-message" class="state-message hidden">
      <div class="state-icon" id="state-icon">🔍</div>
      <p id="state-text">Detecting stack...</p>
    </div>
  </main>

  <footer class="app-footer">
    <span class="credit">Crafted by <strong>SkdSam</strong></span>
    <button id="rescan-btn" class="rescan-btn" title="Rescan current page in-place">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
      </svg>
      Rescan
    </button>
  </footer>

  <script src="../lib/tech-logos.js"></script>
  <script src="popup.js"></script>
</body>
</html>
